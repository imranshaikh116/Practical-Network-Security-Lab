<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)" rx="12"/>

  <!-- Border -->
  <rect width="900" height="280" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)" rx="2"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#161b22" stroke-width="1" opacity="0.6">
    <line x1="0" y1="56" x2="900" y2="56"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- Left decorative network nodes -->
  <g filter="url(#glow)" opacity="0.4">
    <circle cx="60" cy="80" r="4" fill="#238636"/>
    <circle cx="110" cy="50" r="3" fill="#2ea043"/>
    <circle cx="40" cy="140" r="3" fill="#238636"/>
    <circle cx="90" cy="170" r="4" fill="#2ea043"/>
    <circle cx="130" cy="110" r="3" fill="#238636"/>
    <line x1="60" y1="80" x2="110" y2="50" stroke="#238636" stroke-width="1"/>
    <line x1="60" y1="80" x2="40" y2="140" stroke="#238636" stroke-width="1"/>
    <line x1="40" y1="140" x2="90" y2="170" stroke="#2ea043" stroke-width="1"/>
    <line x1="110" y1="50" x2="130" y2="110" stroke="#238636" stroke-width="1"/>
    <line x1="130" y1="110" x2="90" y2="170" stroke="#2ea043" stroke-width="1"/>
  </g>

  <!-- Right decorative network nodes -->
  <g filter="url(#glow)" opacity="0.4">
    <circle cx="840" cy="80" r="4" fill="#238636"/>
    <circle cx="790" cy="50" r="3" fill="#2ea043"/>
    <circle cx="860" cy="140" r="3" fill="#238636"/>
    <circle cx="810" cy="170" r="4" fill="#2ea043"/>
    <circle cx="770" cy="110" r="3" fill="#238636"/>
    <line x1="840" y1="80" x2="790" y2="50" stroke="#238636" stroke-width="1"/>
    <line x1="840" y1="80" x2="860" y2="140" stroke="#238636" stroke-width="1"/>
    <line x1="860" y1="140" x2="810" y2="170" stroke="#2ea043" stroke-width="1"/>
    <line x1="790" y1="50" x2="770" y2="110" stroke="#238636" stroke-width="1"/>
    <line x1="770" y1="110" x2="810" y2="170" stroke="#2ea043" stroke-width="1"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(390, 42)" filter="url(#glow)">
    <path d="M60 0 L120 22 L120 70 Q120 100 60 120 Q0 100 0 70 L0 22 Z"
          fill="none" stroke="#238636" stroke-width="2" opacity="0.8"/>
    <path d="M60 20 L100 36 L100 68 Q100 88 60 104 Q20 88 20 68 L20 36 Z"
          fill="#238636" opacity="0.15"/>
    <!-- Lock icon inside shield -->
    <rect x="44" y="58" width="32" height="24" rx="3" fill="#2ea043" opacity="0.9"/>
    <path d="M50 58 L50 50 Q50 40 60 40 Q70 40 70 50 L70 58"
          fill="none" stroke="#2ea043" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="68" r="4" fill="#0d1117"/>
  </g>

  <!-- Main title -->
  <text x="450" y="100" font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
        font-size="32" font-weight="700" fill="#e6edf3"
        text-anchor="middle" letter-spacing="-0.5">
    Practical Network Security Lab
  </text>

  <!-- Subtitle -->
  <text x="450" y="132" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="400" fill="#8b949e"
        text-anchor="middle" letter-spacing="0.3">
    13 modules · Attack → Detect → Fix → Report
  </text>

  <!-- Flow pipeline -->
  <g transform="translate(195, 162)">
    <!-- Recon -->
    <rect x="0" y="0" width="88" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="20" font-family="system-ui, sans-serif" font-size="12"
          fill="#58a6ff" text-anchor="middle" font-weight="500">Reconnaissance</text>

    <text x="98" y="20" font-family="system-ui" font-size="14" fill="#238636">→</text>

    <!-- Exploit -->
    <rect x="112" y="0" width="88" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="156" y="20" font-family="system-ui, sans-serif" font-size="12"
          fill="#f85149" text-anchor="middle" font-weight="500">Exploitation</text>

    <text x="210" y="20" font-family="system-ui" font-size="14" fill="#238636">→</text>

    <!-- Evidence -->
    <rect x="224" y="0" width="88" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="268" y="20" font-family="system-ui, sans-serif" font-size="12"
          fill="#e3b341" text-anchor="middle" font-weight="500">Evidence</text>

    <text x="322" y="20" font-family="system-ui" font-size="14" fill="#238636">→</text>

    <!-- Detect -->
    <rect x="336" y="0" width="88" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="380" y="20" font-family="system-ui, sans-serif" font-size="12"
          fill="#3fb950" text-anchor="middle" font-weight="500">Detect &amp; Fix</text>

    <text x="434" y="20" font-family="system-ui" font-size="14" fill="#238636">→</text>

    <!-- Report -->
    <rect x="448" y="0" width="68" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="482" y="20" font-family="system-ui, sans-serif" font-size="12"
          fill="#a371f7" text-anchor="middle" font-weight="500">Report</text>
  </g>

  <!-- Bottom stats -->
  <g transform="translate(0, 215)">
    <line x1="60" y1="0" x2="840" y2="0" stroke="#21262d" stroke-width="1"/>

    <text x="180" y="28" font-family="system-ui, sans-serif" font-size="13"
          fill="#3fb950" text-anchor="middle" font-weight="600">13 Modules</text>

    <text x="340" y="28" font-family="system-ui, sans-serif" font-size="13"
          fill="#58a6ff" text-anchor="middle" font-weight="600">4 Detection Scripts</text>

    <text x="500" y="28" font-family="system-ui, sans-serif" font-size="13"
          fill="#e3b341" text-anchor="middle" font-weight="600">11 Sample PCAPs</text>

    <text x="660" y="28" font-family="system-ui, sans-serif" font-size="13"
          fill="#a371f7" text-anchor="middle" font-weight="600">Red Team Capstone</text>

    <!-- Dots between stats -->
    <circle cx="260" cy="22" r="2" fill="#30363d"/>
    <circle cx="420" cy="22" r="2" fill="#30363d"/>
    <circle cx="580" cy="22" r="2" fill="#30363d"/>
  </g>

  <!-- Kali label bottom right -->
  <text x="850" y="265" font-family="'Courier New', monospace" font-size="10"
        fill="#30363d" text-anchor="end">Kali Linux · VirtualBox · VMware</text>
</svg>
